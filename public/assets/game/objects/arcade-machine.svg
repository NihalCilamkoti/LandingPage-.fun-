<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260" fill="none">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3E2B"/>
      <stop offset="100%" stop-color="#141C13"/>
    </linearGradient>
    <linearGradient id="goldTrim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2"/>
      <stop offset="50%" stop-color="#CBB57B"/>
      <stop offset="100%" stop-color="#9A8449"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Shadow -->
  <ellipse cx="100" cy="250" rx="70" ry="8" fill="#000000" fill-opacity="0.25"/>

  <!-- Cabinet Body Outer -->
  <path d="M40 30 L160 30 L150 240 L50 240 Z" fill="url(#bodyGrad)" stroke="url(#goldTrim)" stroke-width="4" stroke-linejoin="round"/>
  
  <!-- Cabinet Side Panels / Perspective Wings -->
  <path d="M30 50 L40 30 L50 240 L35 235 Z" fill="#1B2618" stroke="url(#goldTrim)" stroke-width="2"/>
  <path d="M170 50 L160 30 L150 240 L165 235 Z" fill="#141C13" stroke="url(#goldTrim)" stroke-width="2"/>

  <!-- Marquee Header -->
  <rect x="44" y="38" width="112" height="36" rx="6" fill="#121911" stroke="url(#goldTrim)" stroke-width="2"/>
  <rect x="48" y="42" width="104" height="28" rx="4" fill="#CBB57B" fill-opacity="0.2"/>
  <text x="100" y="60" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="900" fill="#FFF2B2" text-anchor="middle" letter-spacing="2">ENTHIOS ARCADE</text>
  <circle cx="54" cy="56" r="2.5" fill="#10B981" filter="url(#glow)"/>
  <circle cx="146" cy="56" r="2.5" fill="#10B981" filter="url(#glow)"/>

  <!-- CRT Screen Bezel -->
  <rect x="48" y="82" width="104" height="76" rx="8" fill="#0A0F0D" stroke="#334155" stroke-width="3"/>
  <!-- Glowing Screen -->
  <rect x="54" y="88" width="92" height="64" rx="6" fill="url(#screenGrad)"/>
  
  <!-- Screen Grid Scanlines -->
  <line x1="54" y1="96" x2="146" y2="96" stroke="#CBB57B" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="54" y1="106" x2="146" y2="106" stroke="#CBB57B" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="54" y1="116" x2="146" y2="116" stroke="#CBB57B" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="54" y1="126" x2="146" y2="126" stroke="#CBB57B" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="54" y1="136" x2="146" y2="136" stroke="#CBB57B" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Pixel Mascot Graphic on Screen -->
  <circle cx="100" cy="116" r="14" fill="#F59E0B" fill-opacity="0.25" filter="url(#glow)"/>
  <path d="M100 106 L108 122 L92 122 Z" fill="#F59E0B" stroke="#FFF2B2" stroke-width="1.5"/>
  <circle cx="97" cy="117" r="1.5" fill="#141C13"/>
  <circle cx="103" cy="117" r="1.5" fill="#141C13"/>
  <text x="100" y="142" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#10B981" text-anchor="middle">★ READY ★</text>

  <!-- Control Deck Panel -->
  <path d="M42 165 L158 165 L152 195 L48 195 Z" fill="#1E281C" stroke="url(#goldTrim)" stroke-width="2"/>
  
  <!-- Joystick -->
  <ellipse cx="72" cy="184" rx="8" ry="4" fill="#0A0F0D"/>
  <line x1="72" y1="184" x2="68" y2="172" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="67" cy="170" r="6" fill="#F43F5E" filter="url(#glow)"/>

  <!-- Action Buttons (Colorful) -->
  <circle cx="106" cy="178" r="4.5" fill="#10B981" stroke="#064E3B" stroke-width="1.5"/>
  <circle cx="118" cy="173" r="4.5" fill="#F59E0B" stroke="#78350F" stroke-width="1.5"/>
  <circle cx="130" cy="178" r="4.5" fill="#0EA5E9" stroke="#0C4A6E" stroke-width="1.5"/>

  <!-- Coin Door Lower Cabinet -->
  <rect x="65" y="202" width="70" height="32" rx="4" fill="#0F1710" stroke="#334155" stroke-width="1.5"/>
  <rect x="75" y="208" width="16" height="20" rx="2" fill="#1E293B" stroke="#64748B" stroke-width="1"/>
  <rect x="81" y="212" width="4" height="8" rx="1" fill="#F59E0B"/>
  <rect x="109" y="208" width="16" height="20" rx="2" fill="#1E293B" stroke="#64748B" stroke-width="1"/>
  <rect x="115" y="212" width="4" height="8" rx="1" fill="#F59E0B"/>
</svg>
